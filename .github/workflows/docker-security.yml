name: Docker security

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - scripts/package.json
      - scripts/package-lock.json
      - .github/workflows/docker-security.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - scripts/package.json
      - scripts/package-lock.json
      - .github/workflows/docker-security.yml
  schedule:
    - cron: "41 4 * * 1" # Mondays: new CVEs appear without any code change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Warnings (unpinned apk packages, ...) are reported but only errors fail the job.
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF (not granted to Dependabot / fork PRs, see below)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same placeholders as docker-build.yml: nothing connects to a database at build time.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: sam:scan
          build-args: |
            NEXTAUTH_SECRET=build-time-placeholder-not-used-at-runtime
            NEXTAUTH_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate: fixable HIGH / CRITICAL vulnerabilities fail the job.
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sam:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Results for the Security tab; PR tokens may be read-only, so main and the schedule only.
      - name: Scan image (SARIF)
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sam:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
