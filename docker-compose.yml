# SAM – Simple Asset Management
# Full-stack docker-compose: app + MySQL database
#
# Required: copy .env.example to .env and fill in all values before running.
#
# First-time setup:
#   docker compose up -d
#   docker compose exec app npx prisma db push   # create tables
#   # Then visit http://localhost:3000 → setup wizard

services:
  # ── Application ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sam-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "mysql://sam:${MYSQL_PASSWORD}@db:3306/samdb"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      UPLOAD_DIR: "/app/uploads"
      # Microsoft Entra ID SSO (optional — leave blank to disable)
      AUTH_MICROSOFT_ENTRA_ID_ID: "${AUTH_MICROSOFT_ENTRA_ID_ID:-}"
      AUTH_MICROSOFT_ENTRA_ID_SECRET: "${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}"
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: "${AUTH_MICROSOFT_ENTRA_ID_ISSUER:-}"
      # Prometheus / monitoring integration (optional — leave blank to disable)
      PROMETHEUS_SD_TOKEN: "${PROMETHEUS_SD_TOKEN:-}"
      # HashiCorp Vault (optional — required for {vault_*} template placeholders)
      VAULT_ADDR: "${VAULT_ADDR:-}"
      VAULT_TOKEN: "${VAULT_TOKEN:-}"
      VAULT_KV_VERSION: "${VAULT_KV_VERSION:-v2}"
    volumes:
      - sam-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/setup || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Database ───────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: sam-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: samdb
      MYSQL_USER: sam
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - sam-mysql-data:/var/lib/mysql
    # Only expose port to host if needed for external access / dev tools
    # Remove or comment out this section for production deployments
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sam-uploads:
    driver: local
  sam-mysql-data:
    driver: local
