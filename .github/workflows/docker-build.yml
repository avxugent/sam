name: Build and publish Docker image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"           # e.g. v1.2.3 — triggers a versioned release image
  pull_request:
    branches:
      - main
      - master             # builds the image on PRs but does NOT push

# GitHub Enterprise instance
env:
  REGISTRY: ghcr.io                          # GHE still uses ghcr.io
  IMAGE_NAME: ${{ github.repository }}       # avx/sam  (lowercased automatically)

jobs:
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write      # required to push to GitHub Container Registry

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx (needed for cache + multi-platform) ────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Log in to GitHub Container Registry ────────────────────────────
      # On pull_request events the GITHUB_TOKEN does not have write permission,
      # so the push step is skipped. Login still succeeds for read-only access.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Derive image tags and labels ───────────────────────────────────
      # docker/metadata-action generates:
      #   - branch push  → ghcr.io/avx/sam:main  (or :master)
      #   - version tag  → ghcr.io/avx/sam:v1.2.3 + ghcr.io/avx/sam:latest
      #   - PR           → ghcr.io/avx/sam:pr-42  (not pushed)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # branch name for every push to main/master
            type=ref,event=branch
            # PR number (image built but not pushed)
            type=ref,event=pr
            # full semver from tag (e.g. v1.2.3 → 1.2.3)
            type=semver,pattern={{version}}
            # major.minor from tag (e.g. v1.2.3 → 1.2)
            type=semver,pattern={{major}}.{{minor}}
            # 'latest' on every tagged release
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # short commit SHA for traceability (always added)
            type=sha,prefix=sha-,format=short

      # ── 5. Build (and push if not a PR) ───────────────────────────────────
      # Prisma client generation requires DB vars at build time. The app does NOT
      # connect to the DB during build — dummy values are sufficient.
      # NEXTAUTH_SECRET and NEXTAUTH_URL are required to avoid next-auth build errors.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # Build-time environment variables (dummy values — no real DB needed)
          build-args: |
            DB_HOST=localhost
            DB_PORT=3306
            DB_NAME=samdb
            DB_USER=sam
            DB_PASSWORD=build
            NEXTAUTH_SECRET=build-time-placeholder-not-used-at-runtime
            NEXTAUTH_URL=http://localhost:3000
            NEXT_TELEMETRY_DISABLED=1

          # Layer cache: read from the registry image of the target branch,
          # write back so subsequent builds are faster.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # ── 6. Print image digest for traceability ────────────────────────────
      - name: Print image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Image pushed:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/  /'
          echo "Digest: ${{ steps.build-push.outputs.digest }}"
