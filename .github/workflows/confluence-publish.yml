name: Publish docs to Confluence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "doc/**"
      - "markdown-confluence.json"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Confluence
        uses: markdown-confluence/publish@v1
        with:
          configFile: markdown-confluence.json
          confluenceBaseUrl: ${{ secrets.CONFLUENCE_BASE_URL }}
          atlassianUserName: ${{ secrets.ATLASSIAN_USERNAME }}
          atlassianApiToken: ${{ secrets.ATLASSIAN_API_TOKEN }}
          confluenceParentId: ${{ secrets.CONFLUENCE_PARENT_PAGE_ID }}
