name: Publish docs to Confluence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "doc/**"
      - "markdown-confluence-sync.config.js"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Confluence
        uses: Telefonica/markdown-confluence-sync-action@v2
        with:
          mode: tree
          docs-dir: ./doc
          confluence-url: ${{ secrets.CONFLUENCE_URL }}
          confluence-space-key: ${{ secrets.CONFLUENCE_SPACE_KEY }}
          confluence-root-page-id: ${{ secrets.CONFLUENCE_ROOT_PAGE_ID }}
          confluence-authentication: |
            {
              "basic": {
                "username": "${{ secrets.ATLASSIAN_USERNAME }}",
                "apiToken": "${{ secrets.ATLASSIAN_API_TOKEN }}"
              }
            }
