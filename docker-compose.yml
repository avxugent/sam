# SAM – Simple Asset Management
# Full-stack docker-compose: app + MySQL database
#
# Required: copy .env.example to .env and fill in all values before running.
#
# First-time setup:
#   docker compose up -d
#   docker compose exec app npx prisma db push   # create tables
#   # Then visit http://localhost:3000 → setup wizard

services:
  # ── Application ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sam-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Database — individual connection parameters (app assembles the URL internally)
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME:-samdb}"
      DB_USER: "${DB_USER:-sam}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_SSL: "${DB_SSL:-false}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      UPLOAD_DIR: "/app/uploads"
      # Storage backend — leave unset for local disk (default), or set to "s3"
      # to route attachment uploads and CSV backups through an S3-compatible
      # bucket. When STORAGE_DRIVER=s3, the sam-uploads volume below is
      # unused; you can drop the volume mapping if you do not need to store
      # any other state on disk.
      STORAGE_DRIVER: "${STORAGE_DRIVER:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      EXPORT_S3_PREFIX: "${EXPORT_S3_PREFIX:-backups/}"
      # Audit-log forwarding (optional — leave SYSLOG_HOST blank to disable).
      # When set, audit entries are forwarded to the configured rsyslog
      # server in real time and unforwarded rows can be replayed via
      # `node scripts/forward-audit.mjs` (run from cron).
      SYSLOG_HOST: "${SYSLOG_HOST:-}"
      SYSLOG_PORT: "${SYSLOG_PORT:-}"
      SYSLOG_TRANSPORT: "${SYSLOG_TRANSPORT:-udp}"
      SYSLOG_APP_NAME: "${SYSLOG_APP_NAME:-sam}"
      SYSLOG_HOSTNAME: "${SYSLOG_HOSTNAME:-}"
      SYSLOG_FACILITY: "${SYSLOG_FACILITY:-10}"
      SYSLOG_TIMEOUT_MS: "${SYSLOG_TIMEOUT_MS:-3000}"
      SYSLOG_CA_BUNDLE: "${SYSLOG_CA_BUNDLE:-}"
      SYSLOG_TLS_REJECT_UNAUTHORIZED: "${SYSLOG_TLS_REJECT_UNAUTHORIZED:-true}"
      # Microsoft Entra ID SSO (optional — leave blank to disable)
      AUTH_MICROSOFT_ENTRA_ID_ID: "${AUTH_MICROSOFT_ENTRA_ID_ID:-}"
      AUTH_MICROSOFT_ENTRA_ID_SECRET: "${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}"
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: "${AUTH_MICROSOFT_ENTRA_ID_ISSUER:-}"
      # Prometheus / monitoring integration (optional — leave blank to disable)
      PROMETHEUS_SD_TOKEN: "${PROMETHEUS_SD_TOKEN:-}"
      # HashiCorp Vault (optional — required for {vault_*} template placeholders)
      VAULT_ADDR: "${VAULT_ADDR:-}"
      VAULT_TOKEN: "${VAULT_TOKEN:-}"
      VAULT_KV_VERSION: "${VAULT_KV_VERSION:-v2}"
    volumes:
      - sam-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/setup || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Database ───────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: sam-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME:-samdb}"
      MYSQL_USER: "${DB_USER:-sam}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - sam-mysql-data:/var/lib/mysql
    # Uncomment to expose MySQL to the host (development / external tools only)
    # ports:
    #   - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sam-uploads:
    driver: local
  sam-mysql-data:
    driver: local
