name: CI — Lint, Type-check & Test

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "doc/**"
      - "**.md"
      - "markdown-confluence-sync.config.cjs"
      - ".github/workflows/confluence-publish.yml"
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "doc/**"
      - "**.md"
      - "markdown-confluence-sync.config.cjs"
      - ".github/workflows/confluence-publish.yml"

jobs:
  ci:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── 2. Set up Node.js ──────────────────────────────────────────────────
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Dependency audit ────────────────────────────────────────────────
      - name: Dependency audit
        run: npm audit --audit-level=moderate

      # ── 5. Generate Prisma client ──────────────────────────────────────────
      # Required before TypeScript type-checking (the client types are generated)
      - name: Generate Prisma client
        run: npx prisma generate

      # ── 6. TypeScript type-check ───────────────────────────────────────────
      # Runs `tsc --noEmit` — fails on any type error in the whole project.
      - name: TypeScript type-check
        run: npx tsc --noEmit

      # The maintenance scripts are plain .mjs; this checks them against the
      # lib/ and Prisma types they use (tsconfig.scripts.json).
      - name: Type-check maintenance scripts
        run: npm run typecheck:scripts

      # ── 7. ESLint ─────────────────────────────────────────────────────────
      # Runs the Next.js-bundled ESLint config.
      - name: ESLint
        run: npm run lint -- --max-warnings 0

      # ── 8. Unit tests + coverage ───────────────────────────────────────────
      # Runs all tests and enforces the 80% coverage threshold.
      # Dummy DB values — no real DB is needed for unit tests.
      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          DB_HOST: "localhost"
          DB_PORT: "3306"
          DB_NAME: "samdb"
          DB_USER: "sam"
          DB_PASSWORD: "test"
          DB_SSL: "false"
          NEXTAUTH_SECRET: "ci-test-secret"
          NEXTAUTH_URL: "http://localhost:3000"

      # ── 9. Upload coverage report ──────────────────────────────────────────
      - name: Upload coverage to GitHub (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration:
    name: Integration tests (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: samdb
          MYSQL_USER: sam
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        # Over TCP, so the init-time server (started with --skip-networking)
        # does not count as healthy.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_NAME: "samdb"
      DB_USER: "sam"
      DB_PASSWORD: "test"
      DB_SSL: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # caching_sha2_password without TLS rejects a user's first login after a
      # server start ("RSA public key is not available"); one login over the
      # socket warms the server's auth cache for the MariaDB driver.
      - name: Warm up MySQL auth cache
        run: docker exec ${{ job.services.mysql.id }} mysql -u sam -ptest samdb -e "SELECT 1"

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run integration tests
        run: npm run test:integration
