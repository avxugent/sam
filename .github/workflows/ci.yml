name: CI — Lint, Type-check & Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  ci:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ──────────────────────────────────────────────────
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Dependency audit ────────────────────────────────────────────────
      - name: Dependency audit
        run: npm audit --audit-level=moderate

      # ── 5. Generate Prisma client ──────────────────────────────────────────
      # Required before TypeScript type-checking (the client types are generated)
      - name: Generate Prisma client
        run: npx prisma generate

      # ── 6. TypeScript type-check ───────────────────────────────────────────
      # Runs `tsc --noEmit` — fails on any type error in the whole project.
      - name: TypeScript type-check
        run: npx tsc --noEmit

      # ── 7. ESLint ─────────────────────────────────────────────────────────
      # Runs the Next.js-bundled ESLint config.
      - name: ESLint
        run: npm run lint -- --max-warnings 0

      # ── 8. Unit tests + coverage ───────────────────────────────────────────
      # Runs all tests and enforces the 80% coverage threshold.
      # Dummy DB values — no real DB is needed for unit tests.
      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          DB_HOST: "localhost"
          DB_PORT: "3306"
          DB_NAME: "samdb"
          DB_USER: "sam"
          DB_PASSWORD: "test"
          DB_SSL: "false"
          NEXTAUTH_SECRET: "ci-test-secret"
          NEXTAUTH_URL: "http://localhost:3000"

      # ── 9. Upload coverage report ──────────────────────────────────────────
      - name: Upload coverage to GitHub (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
