# Development Docker Compose
#
# Runs the full SAM stack locally with MySQL, Vault, and Prometheus.
# All credentials are hardcoded for development — do NOT use in production.
#
# Usage:
#   cd development
#   docker compose up --build
#
# Services:
#   app        — http://localhost:3000  (Next.js dev server, hot reload)
#   db         — localhost:3306         (MySQL 8)
#   vault      — http://localhost:8200  (Vault UI, token: root)
#   vault-init — (one-shot init; run: docker compose logs vault-init for AppRole creds)
#   prometheus — http://localhost:9090  (Prometheus UI)
#   grafana    — http://localhost:3001  (admin/admin; SAM dashboards preloaded)
#   mock-exporter — http://localhost:9101/probe?target=<hostname>  (fake device metrics)

services:

  # ── Application ──────────────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: development/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Database — individual connection parameters (app assembles the URL internally)
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_NAME: "samdb"
      DB_USER: "sam"
      DB_PASSWORD: "sampassword"
      DB_SSL: "false"
      NEXTAUTH_SECRET: "dev-secret-do-not-use-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
      UPLOAD_DIR: "/app/uploads"
      # Storage backend — leave unset for local disk (default), or set to "s3"
      # to route attachment uploads and CSV backups through an S3-compatible
      # bucket. When STORAGE_DRIVER=s3 the dev_uploads volume below is unused.
      STORAGE_DRIVER: "${STORAGE_DRIVER:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      EXPORT_S3_PREFIX: "${EXPORT_S3_PREFIX:-backups/}"
      # Vault — token auth (switch to AppRole by setting VAULT_ROLE_ID/VAULT_SECRET_ID
      # and leaving VAULT_TOKEN blank; see vault-init logs for the generated credentials)
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
      VAULT_KV_VERSION: "v2"
      # Prometheus SD — must match the credentials in prometheus/prometheus.yml
      PROMETHEUS_SD_TOKEN: "dev-prometheus-token"
      # SAM reads the room:* recording rules directly for the monitoring
      # summaries on the location and asset pages — one JSON query each, rather
      # than a rendered image per number.
      PROMETHEUS_URL: "${PROMETHEUS_URL:-http://prometheus:9090}"
      # Grafana panel embedding. SAM fetches panels server-side, so this is the
      # in-network address; the browser never talks to Grafana directly.
      # The token must be created once in Grafana (Administration → Service
      # accounts) and passed in, e.g. GRAFANA_TOKEN=... docker compose up.
      GRAFANA_URL: "${GRAFANA_URL:-http://grafana:3000}"
      GRAFANA_TOKEN: "${GRAFANA_TOKEN:-}"
    # Lets PROMETHEUS_URL/GRAFANA_URL point at host.docker.internal on Linux as
    # well as macOS, for a Prometheus or Grafana running outside this stack.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mount source for hot reload. node_modules and .next use named
      # volumes so the container-built artifacts don't get overwritten by the
      # (potentially different OS) host copies.
      - ..:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next
      - dev_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped

  # ── Database ─────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: samdb
      MYSQL_USER: sam
      MYSQL_PASSWORD: sampassword
    ports:
      - "3306:3306"
    volumes:
      - dev_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Vault ─────────────────────────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.19
    command: vault server -dev -dev-root-token-id=root
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      # Required by the healthcheck below. The Vault CLI defaults to
      # https://127.0.0.1:8200, but a dev server speaks plain HTTP — without this
      # `vault status` cannot connect, the container never reports healthy, and
      # `app` (depends_on: service_healthy) never starts. The dev-mode banner that
      # prints "export VAULT_ADDR=..." names the same address, but an export made
      # by the entrypoint does not reach the healthcheck's process environment.
      VAULT_ADDR: "http://127.0.0.1:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ── Vault initialisation (one-shot) ──────────────────────────────────────────
  vault-init:
    image: hashicorp/vault:1.19
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: root
    volumes:
      - ./vault/init.sh:/vault/init.sh:ro
    command: sh /vault/init.sh
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"

  # ── Mock device exporter ──────────────────────────────────────────────────────
  # Stands in for the real exporters (Pearl, blackbox, …) so dev has device
  # metrics to go with SAM's inventory. Prometheus reaches it through SAM's
  # service discovery, so the sam_* labels are the real ones — see
  # mock-exporter/mock-exporter.mjs for the scrape template to configure.
  mock-exporter:
    image: node:24-alpine
    working_dir: /app
    command: node mock-exporter.mjs
    volumes:
      - ./mock-exporter:/app:ro
    ports:
      - "9101:9101"
    restart: unless-stopped

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The same rule files Ansible deploys to production — edit them in ops/ and
      # `curl -XPOST localhost:9090/-/reload` to pick the change up.
      - ../ops/ansible/roles/prometheus_sam_rules/files:/etc/prometheus/rules:ro
      # The whole role, so promtool can run the unit tests in here (the image
      # ships promtool, and the test file resolves ../files/ relative to itself):
      #   docker compose exec prometheus \
      #     promtool test rules /opt/sam-rules/tests/sam-rules_test.yml
      - ../ops/ansible/roles/prometheus_sam_rules:/opt/sam-rules:ro
      - dev_prometheus_data:/prometheus
    depends_on:
      - app
    restart: unless-stopped

  # ── Grafana image renderer ────────────────────────────────────────────────────
  # SAM embeds panels as server-rendered PNGs rather than iframes, which needs
  # this plugin — Grafana's /render endpoint is what produces them. Without it,
  # /render answers with an error and SAM's panels show "unavailable".
  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    environment:
      # The renderer drives a headless browser; this keeps its logs useful when
      # a panel renders blank.
      ENABLE_METRICS: "true"
    restart: unless-stopped

  # ── Grafana ───────────────────────────────────────────────────────────────────
  # Loads the *built* dashboard JSON from the Ansible role, so what you see here
  # is what production gets. Rebuild after editing jsonnet:
  #
  #   ops/jsonnet/build.sh
  #
  # Grafana re-reads the files within 30s; no restart needed.
  #
  # Provisioning YAML is duplicated from the role's Jinja templates because dev
  # has no Ansible to render them. Keep the two in step.
  #
  # Runs standalone against an existing Prometheus / SAM — no need for the rest
  # of this stack:
  #
  #   SAM_PROMETHEUS_URL=http://host.docker.internal:9090 \
  #   SAM_BASE_URL=http://host.docker.internal:3000 \
  #   SAM_API_TOKEN=<PROMETHEUS_SD_TOKEN> \
  #     docker compose up -d --no-deps grafana
  #
  # On Linux, host.docker.internal needs `--add-host=host.docker.internal:host-gateway`
  # (see the extra_hosts entry below) or just use the host's LAN address.
  grafana:
    image: grafana/grafana:12.0.0
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      # Consumed by grafana/provisioning/datasources/sam.yaml. Override any of
      # these to point Grafana at an existing Prometheus or SAM instance.
      SAM_PROMETHEUS_URL: "${SAM_PROMETHEUS_URL:-http://prometheus:9090}"
      SAM_BASE_URL: "${SAM_BASE_URL:-http://app:3000}"
      SAM_API_TOKEN: "${SAM_API_TOKEN:-dev-prometheus-token}"
      # Off by default: nothing built so far uses it. Needed only by panels that
      # read SAM's own API, which arrive with the device dashboard. Opt in with
      # GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource.
      GF_INSTALL_PLUGINS: "${GF_INSTALL_PLUGINS-}"
      # Dev only: lets you load /d-solo panel embeds without a login, which is
      # how SAM will embed them. Never do this in production.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Panel rendering for SAM's embedded images. CALLBACK_URL is how the
      # renderer reaches Grafana back — it browses the dashboard itself, so this
      # must be resolvable from the renderer container, not from your laptop.
      GF_RENDERING_SERVER_URL: "http://grafana-renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
      GF_LOG_FILTERS: "rendering:info"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../ops/ansible/roles/grafana_sam/files/dashboards:/var/lib/grafana/dashboards/sam:ro
      - dev_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - grafana-renderer
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  dev_mysql_data:
  dev_node_modules:
  dev_next:
  dev_uploads:
  dev_prometheus_data:
  dev_grafana_data:
